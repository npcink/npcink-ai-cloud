# Cloud cost-controlled enrollment of AI Code Review Standard v1.
# Repository policy: docs/ocr-review-usage-policy-v1.md
# Upstream standard: npcink-workflow-toolbox docs/platform/ai-code-review-standard-v1.md
#
# Enrollment per repository:
#   1. Copy to .github/workflows/ocr-review.yml on a topic branch.
#   2. Secrets: OCR_LLM_URL, OCR_LLM_AUTH_TOKEN (operator types them).
#   3. Variables: OCR_LLM_MODEL, OCR_LLM_USE_ANTHROPIC
#      (OpenAI-compatible providers such as GLM use 'false').
#   4. Merge only after the secrets exist. Keep this workflow advisory:
#      never add it to required checks.
#
# Derived from alibaba/open-code-review examples/github_actions/ocr-review.yml,
# with both the action commit and CLI version pinned deliberately.

name: OpenCodeReview PR Review

# Serialize eligible reviews across this repository, without cancelling work
# that has already spent tokens. Unrelated comments use unique noop groups.
# This is repository-local; other repositories need their own quota controls.
concurrency:
  group: >-
    ${{
      (
        (
          github.event_name == 'pull_request_target'
          && !github.event.pull_request.draft
          && github.event.pull_request.user.type != 'Bot'
          && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        )
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && 'ocr-provider'
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: false

on:
  # pull_request_target so secrets are available for fork PRs; safe because the
  # action only reads the diff and runs no code from the PR.
  pull_request_target:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  # Required by the failure-notification step: posting or updating a
  # pull-request conversation comment goes through the issues API.
  issues: write

jobs:
  code-review:
    # The npm launcher otherwise starts a background global npm update from
    # even `ocr version`. That can remove its own entry point during config.
    # Keep the reviewed CLI pin stable for the whole composite action.
    env:
      OCR_NO_UPDATE: '1'
    # Pinned to the validated Ubuntu 26.04 image: the pilot's runner canary
    # proved the review action end-to-end on ubuntu-26.04 on 2026-10-04
    # (npcink-abilities-toolkit run 37258146682), ahead of the 2026-10-19
    # ubuntu-latest migration (actions/runner-images#14748). Re-run the
    # canary before bumping further.
    runs-on: ubuntu-26.04
    # One action invocation with room for setup and failure reporting.
    timeout-minutes: 20
    # Only trusted humans auto-spend quota. Untrusted/bot PRs need a maintainer's
    # explicit request; draft/closed PRs are also rejected by the context guard.
    if: |
      (
        github.event_name == 'pull_request_target'
        && !github.event.pull_request.draft
        && github.event.pull_request.user.type != 'Bot'
        && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.pull_request.author_association)
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association)
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get current PR context and eligibility
        id: pr-context
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const eligible = pullRequest.state === 'open' && !pullRequest.draft;
            core.setOutput('eligible', String(eligible));
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);
            if (!eligible) core.notice('Draft or closed PR: no model calls will be made.');

      - name: Refuse a misconfigured enrollment
        id: config_guard
        if: steps.pr-context.outputs.eligible == 'true'
        # Layer 2 steps 2-3 are prerequisites: without all four values the
        # review below would spend quota on guaranteed
        # provider failures that look exactly like an outage. Values are
        # checked in run: the previous if-form failed the whole workflow
        # at start for every event in observed behavior (zero-job runs,
        # no review rounds registering) until this env form replaced it.
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_LLM_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
        run: |
          if [ -z "$OCR_LLM_URL" ] || [ -z "$OCR_LLM_AUTH_TOKEN" ] || [ -z "$OCR_LLM_MODEL" ] || [ -z "$OCR_LLM_USE_ANTHROPIC" ]; then
            echo "::error::OpenCodeReview is misconfigured for this repository: OCR_LLM_URL and OCR_LLM_AUTH_TOKEN secrets plus OCR_LLM_MODEL and OCR_LLM_USE_ANTHROPIC variables must all be set (AI Code Review Standard v1, Layer 2 steps 2-3)."
            exit 1
          fi

      # No outer retry ladder: quota exhaustion cannot recover through retries.
      # The pinned upstream action can still retry individual model requests.
      - name: Run one bounded OpenCodeReview
        id: ocr_review
        if: steps.pr-context.outputs.eligible == 'true'
        timeout-minutes: 15
        # Action wrapper v1.13.2 (commit 55450a95).
        # The wrapper's `ocr_version` input deliberately installs CLI 1.12.13;
        # the pinned action metadata supports CLI v1.9.6+ and was checked at
        # this commit, so the wrapper and CLI pins are independent by design.
        uses: alibaba/open-code-review@375f64cd6f67a48a135da83cfcf59c52669a09cb
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          # Qwen's compatible-mode endpoint speaks the OpenAI protocol.
          llm_protocol: openai
          ocr_version: '1.12.13'
          review_concurrency: '1'
          effort: low
          # Soft input+output budget, not a hard billing cap: an in-flight
          # round and a final submission round may exceed it.
          max_tokens_budget: '80000'
          review_task_timeout: '8'
          checkpoint_range: 'true'
          sticky_summary: 'true'
          language: English
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}

      - name: Reject incomplete advisory evidence
        if: steps.ocr_review.outcome == 'success'
        env:
          OCR_RANGE_REASON: ${{ steps.ocr_review.outputs.range_reason }}
          OCR_COMMENTS_FAILED: ${{ steps.ocr_review.outputs.comments_failed }}
          OCR_SUMMARY_URL: ${{ steps.ocr_review.outputs.summary_comment_url }}
        uses: actions/github-script@v9
        with:
          script: |
            // The CLI can exit 0 after a budget stop with partial findings.
            // Keep those findings, but do not call the advisory round complete.
            const fs = require('fs');
            if (Number(process.env.OCR_COMMENTS_FAILED) > 0) {
              core.setFailed('Some review findings could not be posted; inspect the artifact before retrying.');
              return;
            }
            if (process.env.OCR_RANGE_REASON === 'same_head_noop') return;
            if (!process.env.OCR_SUMMARY_URL) {
              core.setFailed('No advisory summary was delivered; inspect the artifact before retrying.');
              return;
            }
            let result;
            try {
              result = JSON.parse(fs.readFileSync('/tmp/ocr-result.json', 'utf8'));
            } catch (error) {
              core.setFailed(`Could not read OCR result file: ${error.message}. Inspect the artifact before retrying.`);
              return;
            }
            const terminal = result.manifest?.terminal_state || result.status;
            // A docs-only selection is a valid zero-call skip, not a failure.
            if (terminal !== 'complete' && terminal !== 'skipped') {
              core.setFailed('Review evidence is incomplete (budget, timeout, or provider failure); inspect the artifact. Do not automatically retry or raise the budget.');
            }

      - name: Report failed advisory review
        # A failed or partial run is advisory (never required), and the merge
        # can proceed without complete AI evidence. One visible marker
        # comment makes the gap actionable. Bot comments cannot re-trigger
        # this workflow, so this cannot loop. Repeated failures update the
        # single existing marker comment (found by its tag) instead of
        # adding one comment per failed attempt.
        if: failure()
        env:
          OCR_CONFIG_FAILED: ${{ steps.config_guard.outcome == 'failure' }}
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber =
              context.issue.number || context.payload.pull_request.number;
            if (!prNumber) {
              core.notice('No pull request number in this event; nothing to report.');
              return;
            }
            const marker = '<!-- ocr-review-failed -->';
            const configFailed = process.env.OCR_CONFIG_FAILED === 'true';
            const body = [
              marker,
              configFailed
                ? '**Advisory OpenCodeReview enrollment is incomplete - no AI review was delivered.**'
                : '**Advisory OpenCodeReview failed or is incomplete - complete AI review evidence was not delivered.**',
              '',
              configFailed
                ? 'A maintainer must configure the two OCR_LLM secrets and two variables named in the run annotation before requesting another review.'
                : 'This check is advisory and will not automatically retry. Inspect the artifact first: for 429/quota exhaustion, wait for quota recovery or an operator-configured key; for a budget stop, split the PR or record partial coverage. Request one `/open-code-review` only after the cause is resolved, or record why the change merges without complete AI evidence.',
              '',
              `Latest failed run (attempt ${context.runAttempt}): ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              }
            );
            const existing = comments.find(
              (comment) =>
                comment.body &&
                comment.body.includes(marker) &&
                comment.user.type === 'Bot' &&
                comment.user.login === 'github-actions[bot]'
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }

      - name: Clean up the advisory failure marker on success
        # A marker comment left behind by an earlier failed run is misleading
        # once a later run succeeds (the delivered review is right next to a
        # stale "no review delivered" notice). Remove it so the pull request
        # state stays truthful; matched only on the bot's own tagged comment.
        if: success() && steps.ocr_review.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber =
              context.issue.number || context.payload.pull_request.number;
            if (!prNumber) {
              return;
            }
            const marker = '<!-- ocr-review-failed -->';
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              }
            );
            const stale = comments.find(
              (comment) =>
                comment.body &&
                comment.body.includes(marker) &&
                comment.user.type === 'Bot' &&
                comment.user.login === 'github-actions[bot]'
            );
            if (stale) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: stale.id
              });
            }
