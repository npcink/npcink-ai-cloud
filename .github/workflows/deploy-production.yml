name: Deploy Production
run-name: Deploy production ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Paste dispatch_expected_sha from production:release:preflight"
        required: true
        type: string
      confirmation:
        description: "Type: Approved for production validation by operator."
        required: true
        type: string
      run_formal_release_smoke:
        description: "Run fail-closed authenticated smoke after a completed ordinary deploy"
        required: true
        default: false
        type: boolean
      finalized_runtime_network_repair:
        description: "Repair missing finalized active-release runtime-network state before ordinary deployment"
        required: true
        default: false
        type: boolean
      finalized_runtime_network_repair_confirmation:
        description: "When repair is enabled, type: Approved for finalized runtime-network repair by operator."
        required: false
        type: string

concurrency:
  group: production-host-mutation
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to cloud.npc.ink
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Record authorization latency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          created_at="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --jq '.created_at'
          )"
          created_epoch="$(date -u -d "${created_at}" +%s)"
          started_epoch="$(date -u +%s)"
          authorization_latency_seconds="$((started_epoch - created_epoch))"
          {
            echo "## Production Authorization Timing"
            echo ""
            echo "- dispatch_to_job_seconds=${authorization_latency_seconds}"
            echo "- authorization=workflow_dispatch exact confirmation"
            echo "- environment=secrets and production branch policy"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate operator confirmation
        env:
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_sha }}
          OPERATOR_CONFIRMATION: ${{ inputs.confirmation }}
          FINALIZED_RUNTIME_NETWORK_REPAIR: ${{ inputs.finalized_runtime_network_repair }}
          FINALIZED_RUNTIME_NETWORK_REPAIR_CONFIRMATION: ${{ inputs.finalized_runtime_network_repair_confirmation }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_PRODUCTION_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${EXPECTED_PRODUCTION_SHA}" = "${GITHUB_SHA}"
          test "${OPERATOR_CONFIRMATION}" = "Approved for production validation by operator."
          if [ "${FINALIZED_RUNTIME_NETWORK_REPAIR}" = "true" ]; then
            test "${FINALIZED_RUNTIME_NETWORK_REPAIR_CONFIRMATION}" = "Approved for finalized runtime-network repair by operator."
          else
            test -z "${FINALIZED_RUNTIME_NETWORK_REPAIR_CONFIRMATION}"
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Require successful CI and CodeQL for this production commit
        id: production_ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ci_run="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch=production \
              -f event=push \
              -f status=completed \
              -f per_page=20 |
              jq -c --arg sha "${GITHUB_SHA}" \
                '[.workflow_runs[] | select(.head_sha == $sha)][0] // {}'
          )"
          conclusion="$(jq -r '.conclusion // ""' <<<"${ci_run}")"
          ci_run_id="$(jq -r '.id // ""' <<<"${ci_run}")"
          test "${conclusion}" = "success"
          [[ "${ci_run_id}" =~ ^[0-9]+$ ]]
          codeql_run="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/runs" \
              -f branch=production \
              -f event=push \
              -f status=completed \
              -f per_page=20 |
              jq -c --arg sha "${GITHUB_SHA}" \
                '[.workflow_runs[] | select(.head_sha == $sha)][0] // {}'
          )"
          codeql_conclusion="$(jq -r '.conclusion // ""' <<<"${codeql_run}")"
          codeql_run_id="$(jq -r '.id // ""' <<<"${codeql_run}")"
          test "${codeql_conclusion}" = "success"
          [[ "${codeql_run_id}" =~ ^[0-9]+$ ]]
          printf 'run_id=%s\n' "${ci_run_id}" >> "${GITHUB_OUTPUT}"
          printf 'codeql_run_id=%s\n' "${codeql_run_id}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Exact Production Checks"
            echo ""
            echo "- cloud_ci_run=${ci_run_id}"
            echo "- codeql_run=${codeql_run_id}"
            echo "- production_sha=${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Download exact production release plan
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_CI_RUN_ID: ${{ steps.production_ci.outputs.run_id }}
        run: |
          set -euo pipefail
          artifact_name="production-release-plan-${GITHUB_SHA}"
          gh run download "${PRODUCTION_CI_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${artifact_name}" \
            --dir "${RUNNER_TEMP}/production-release-plan"
          test -f "${RUNNER_TEMP}/production-release-plan/production-release-plan.json"

      - name: Resolve exact release execution plan
        id: release_plan
        run: |
          set -euo pipefail
          python3 scripts/resolve-production-release-action.py \
            --plan "${RUNNER_TEMP}/production-release-plan/production-release-plan.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --head-sha "${GITHUB_SHA}" \
            --head-tree "$(git rev-parse HEAD^{tree})" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Install SSH key
        if: steps.release_plan.outputs.action != 'no_deploy'
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_KEY}"
          test -n "${PROD_SSH_HOST}"
          test -n "${PROD_SSH_USER}"
          test "${PROD_SSH_USER}" = "root"
          test -n "${PROD_SSH_KNOWN_HOSTS}"
          mkdir -p ~/.ssh
          printf '%s\n' "${PROD_SSH_KEY}" > ~/.ssh/npcink_prod_deploy_key
          chmod 600 ~/.ssh/npcink_prod_deploy_key
          printf '%s\n' "${PROD_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          known_host_lookup="${PROD_SSH_HOST}"
          if [ "${PROD_SSH_PORT}" != "22" ]; then
            known_host_lookup="[${PROD_SSH_HOST}]:${PROD_SSH_PORT}"
          fi
          ssh-keygen -F "${known_host_lookup}" -f ~/.ssh/known_hosts >/dev/null

      - name: Preflight certificate readiness receipt
        if: steps.release_plan.outputs.action == 'runtime'
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          PROD_REMOTE_DIR: ${{ secrets.PROD_REMOTE_DIR || '/opt/npcink-ai-cloud' }}
        run: |
          set -euo pipefail
          test "${PROD_SSH_USER}" = "root"
          if [[ ! "${PROD_REMOTE_DIR}" =~ ^/[A-Za-z0-9._/-]+$ ]] || \
            [[ "/${PROD_REMOTE_DIR#/}/" = */../* ]] || \
            [[ "/${PROD_REMOTE_DIR#/}/" = */./* ]]; then
            echo "[certificate-preflight:fail] PROD_REMOTE_DIR must be a safe absolute path without dot traversal." >&2
            exit 1
          fi
          ssh_args=(
            -p "${PROD_SSH_PORT}"
            -i /home/runner/.ssh/npcink_prod_deploy_key
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
            -o ConnectTimeout=10
          )
          ssh "${ssh_args[@]}" "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
            bash -s -- "${PROD_REMOTE_DIR}" <<'REMOTE'
          set -euo pipefail
          remote_dir="$1"
          receipt=/var/lib/npcink-ai-cloud/edge/certificate-renewal-readiness.json
          current_release="$(readlink -f -- "${remote_dir}/current")"
          test -n "${current_release}"
          case "${current_release}" in
            "${remote_dir}"/release-*) ;;
            *) echo "[certificate-preflight:fail] current release is outside the managed root" >&2; exit 1 ;;
          esac
          test -f "${receipt}"
          test ! -L "${receipt}"
          test "$(stat -c '%u:%a' -- "${receipt}")" = "0:600"
          /usr/bin/python3.11 - "${receipt}" <<'PY'
          import json
          import sys
          import time
          from pathlib import Path

          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("contract") != "npcink_cloud_certificate_renewal_readiness.v1":
              raise SystemExit("[certificate-preflight:fail] readiness contract is invalid")
          if payload.get("status") != "passed" or payload.get("domain") != "cloud.npc.ink":
              raise SystemExit("[certificate-preflight:fail] readiness receipt is not passed for cloud.npc.ink")
          generated = payload.get("generated_at_epoch")
          if not isinstance(generated, int):
              raise SystemExit("[certificate-preflight:fail] readiness timestamp is invalid")
          age = int(time.time()) - generated
          if age < -300 or age > 7 * 24 * 60 * 60:
              raise SystemExit(f"[certificate-preflight:fail] readiness receipt is stale (age_seconds={age})")
          print(f"[certificate-preflight:ok] readiness receipt is fresh (age_seconds={age})")
          PY
          REMOTE

      - name: Download exact production deploy bundle
        if: steps.release_plan.outputs.action == 'runtime'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_CI_RUN_ID: ${{ steps.production_ci.outputs.run_id }}
        run: |
          set -euo pipefail
          artifact_name="production-deploy-bundle-${GITHUB_SHA}"
          rm -rf dist
          mkdir -p dist
          gh run download "${PRODUCTION_CI_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${artifact_name}" \
            --dir dist
          test -f dist/deploy-bundle.tgz
          test -f dist/deploy-bundle.tgz.sha256
          bash deploy/verify-release-bundle.sh --archive \
            dist/deploy-bundle.tgz dist/deploy-bundle.tgz.sha256

      - name: Deploy
        id: deploy
        env:
          NPCINK_CLOUD_DEPLOY_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          NPCINK_CLOUD_DEPLOY_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          NPCINK_CLOUD_DEPLOY_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          NPCINK_CLOUD_DEPLOY_IDENTITY_FILE: /home/runner/.ssh/npcink_prod_deploy_key
          NPCINK_CLOUD_DEPLOY_REMOTE_DIR: ${{ secrets.PROD_REMOTE_DIR || '/opt/npcink-ai-cloud' }}
          NPCINK_CLOUD_BASE_URL: ${{ secrets.PROD_BASE_URL || 'https://cloud.npc.ink' }}
          NPCINK_CLOUD_REMOTE_COMPOSE_FILE: docker-compose.runtime.yml
          NPCINK_CLOUD_NO_USER_INTERNAL_VALIDATION_APPROVAL: ${{ secrets.NPCINK_CLOUD_NO_USER_INTERNAL_VALIDATION_APPROVAL }}
          NPCINK_CLOUD_REFRESH_PROVIDERS: "1"
          NPCINK_CLOUD_WITH_OPERATIONAL_READY: "1"
          NPCINK_CLOUD_FINALIZED_RUNTIME_NETWORK_REPAIR_APPROVAL: ${{ inputs.finalized_runtime_network_repair_confirmation }}
        run: |
          set -euo pipefail
          release_action="${{ steps.release_plan.outputs.action }}"
          release_lane="${{ steps.release_plan.outputs.lane }}"
          health_profile="${{ steps.release_plan.outputs.health_profile }}"
          if [ "${release_action}" = "no_deploy" ]; then
            if [ "${{ inputs.run_formal_release_smoke }}" = "true" ]; then
              echo "[fail] Formal release smoke is valid only for a runtime release plan." >&2
              exit 1
            fi
            if [ "${{ inputs.finalized_runtime_network_repair }}" = "true" ]; then
              echo "[fail] A no-deploy release cannot request runtime-network repair." >&2
              exit 1
            fi
            echo "[ok] Exact no_deploy release plan requires no production host mutation."
            {
              echo "installation_state=complete"
              echo "release_lane=${release_lane}"
              echo "release_action=${release_action}"
              echo "health_profile=${health_profile}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${release_action}" = "static" ]; then
            if [ "${{ inputs.run_formal_release_smoke }}" = "true" ]; then
              echo "[fail] Formal release smoke is valid only for a runtime release plan." >&2
              exit 1
            fi
            if [ "${{ inputs.finalized_runtime_network_repair }}" = "true" ]; then
              echo "[fail] A static release cannot request runtime-network repair." >&2
              exit 1
            fi
            bash deploy/deploy-static-terms-to-ssh-host.sh
            {
              echo "installation_state=complete"
              echo "release_lane=${release_lane}"
              echo "release_action=${release_action}"
              echo "health_profile=${health_profile}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          test "${release_action}" = "runtime"
          repair_args=()
          if [ "${{ inputs.finalized_runtime_network_repair }}" = "true" ]; then
            repair_args+=(--finalized-runtime-network-repair)
          fi
          deploy_output_file="$(mktemp)"
          timing_receipt="artifacts/release-timing/production-deploy-phase-timing.json"
          cleanup_deploy_output() {
            exit_status="$?"
            trap - EXIT
            rm -f -- "${deploy_output_file}" || exit_status=1
            exit "${exit_status}"
          }
          trap cleanup_deploy_output EXIT
          mkdir -p "$(dirname "${timing_receipt}")"
          set +e
          bash deploy/deploy-to-ssh-host.sh \
            --no-user-internal-validation \
            --skip-bundle-build \
            --skip-seed \
            --skip-smoke \
            --refresh-providers \
            --with-operational-ready \
            "${repair_args[@]}" \
            --remote-compose-file docker-compose.runtime.yml 2>&1 | tee "${deploy_output_file}"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          deploy_status="${pipeline_status[0]}"
          tee_status="${pipeline_status[1]}"
          effective_status="${deploy_status}"
          if [ "${effective_status}" = "0" ] && [ "${tee_status}" != "0" ]; then
            effective_status="${tee_status}"
          fi
          if ! python3 scripts/report-release-timing.py \
            --deploy-log "${deploy_output_file}" \
            --source-repository "${GITHUB_REPOSITORY}" \
            --source-sha "${GITHUB_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --release-lane "${release_lane}" \
            --release-action "${release_action}" \
            --deploy-exit-status "${effective_status}" \
            --receipt-output "${timing_receipt}" \
            >> "${GITHUB_STEP_SUMMARY}"; then
            {
              echo "## Production Deploy Phase Timing"
              echo ""
              echo "Structured phase timing was unavailable; deployment authority is unchanged."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ "${effective_status}" != "0" ]; then
            exit "${effective_status}"
          fi
          installation_state_count="$(
            awk '/^installation_state=(pending|complete)$/ { count += 1 } END { print count + 0 }' \
              "${deploy_output_file}"
          )"
          if [ "${installation_state_count}" != "1" ]; then
            echo "[fail] Deploy must emit exactly one explicit installation_state=pending|complete result." >&2
            exit 1
          fi
          installation_state="$(
            awk -F= '/^installation_state=(pending|complete)$/ { print $2 }' \
              "${deploy_output_file}"
          )"
          case "${installation_state}" in
            pending|complete) ;;
            *)
              echo "[fail] Deploy emitted an unsupported installation state." >&2
              exit 1
              ;;
          esac
          {
            printf 'installation_state=%s\n' "${installation_state}"
            echo "release_lane=${release_lane}"
            echo "release_action=${release_action}"
            echo "health_profile=${health_profile}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload production deploy timing receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-deploy-timing-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/release-timing/production-deploy-phase-timing.json
          if-no-files-found: ignore
          retention-days: 14

      - name: First-install operator handoff
        if: steps.deploy.outputs.installation_state == 'pending'
        env:
          NPCINK_CLOUD_BASE_URL: ${{ secrets.PROD_BASE_URL || 'https://cloud.npc.ink' }}
        run: |
          set -euo pipefail
          {
            echo "## First installation pending"
            echo ""
            echo "Post-install preflight and release smoke were intentionally skipped."
            echo ""
            echo "1. On an SSH TTY as root, run \`current/deploy/setup-code-rotate.sh\` and save the one-time code without capturing terminal output."
            echo "2. Open \`${NPCINK_CLOUD_BASE_URL%/}/setup\` and complete the PostgreSQL 18 installation."
            echo "3. Save the one-time administrator key shown by Setup."
            echo "4. While the lifecycle remains pending, run the complete-only Release Smoke workflow, WordPress text/image round trips, the RDS restore drill, and the 24–72 hour observation."
            echo "5. Only after those acceptance checks pass, run \`current/deploy/first-install-finalize.sh\` on the production host as root."
            echo "6. Future ordinary deployments will then report \`complete\` and run their post-install gates."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Small-customer preflight
        if: steps.deploy.outputs.installation_state == 'complete' && steps.deploy.outputs.health_profile == 'runtime'
        env:
          NPCINK_CLOUD_BASE_URL: ${{ secrets.PROD_BASE_URL || 'https://cloud.npc.ink' }}
        run: |
          bash deploy/small-customer-trial-preflight.sh \
            --base-url "${NPCINK_CLOUD_BASE_URL}" \
            --require-alipay-enabled

      - name: Formal release smoke
        if: steps.deploy.outputs.installation_state == 'complete' && steps.deploy.outputs.health_profile == 'runtime' && inputs.run_formal_release_smoke
        env:
          NPCINK_CLOUD_BASE_URL: ${{ secrets.PROD_BASE_URL || 'https://cloud.npc.ink' }}
          NPCINK_CLOUD_INTERNAL_AUTH_TOKEN: ${{ secrets.NPCINK_CLOUD_INTERNAL_AUTH_TOKEN }}
          NPCINK_CLOUD_ADMIN_KEY: ${{ secrets.NPCINK_CLOUD_ADMIN_KEY }}
          NPCINK_CLOUD_RELEASE_MEMBER_EMAIL: ${{ secrets.NPCINK_CLOUD_RELEASE_MEMBER_EMAIL }}
          NPCINK_CLOUD_PORTAL_LOGIN_CODE: ${{ secrets.NPCINK_CLOUD_PORTAL_LOGIN_CODE }}
          NPCINK_CLOUD_RELEASE_SITE_ID: ${{ secrets.NPCINK_CLOUD_RELEASE_SITE_ID }}
          NPCINK_CLOUD_RELEASE_KEY_ID: ${{ secrets.NPCINK_CLOUD_RELEASE_KEY_ID }}
          NPCINK_CLOUD_RELEASE_KEY_SECRET: ${{ secrets.NPCINK_CLOUD_RELEASE_KEY_SECRET }}
        run: |
          set -euo pipefail
          set +x
          missing=0
          for key in \
            NPCINK_CLOUD_INTERNAL_AUTH_TOKEN \
            NPCINK_CLOUD_ADMIN_KEY \
            NPCINK_CLOUD_RELEASE_MEMBER_EMAIL \
            NPCINK_CLOUD_PORTAL_LOGIN_CODE \
            NPCINK_CLOUD_RELEASE_SITE_ID \
            NPCINK_CLOUD_RELEASE_KEY_ID \
            NPCINK_CLOUD_RELEASE_KEY_SECRET
          do
            if [ -z "${!key:-}" ]; then
              missing=1
            fi
          done
          if [ "${missing}" = "1" ]; then
            echo "## Formal Release Smoke" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "Failed closed because the selected formal release smoke is missing one or more protected secrets." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          credential_dir="$(mktemp -d)"
          credential_file="${credential_dir}/release-smoke-credentials.json"
          cleanup_credentials() {
            exit_status="$?"
            cleanup_failed=0
            trap - EXIT
            set +e
            rm -f -- "${credential_file}" || cleanup_failed=1
            rmdir -- "${credential_dir}" || cleanup_failed=1
            if [ -e "${credential_dir}" ] || [ -L "${credential_dir}" ]; then
              cleanup_failed=1
            fi
            if [ "${cleanup_failed}" -ne 0 ]; then
              echo "[fail] Formal smoke credential cleanup did not complete." >&2
              exit_status=1
            fi
            exit "${exit_status}"
          }
          trap cleanup_credentials EXIT
          chmod 0700 "${credential_dir}"
          python3 - "${credential_file}" <<'PY'
          from __future__ import annotations

          import json
          import os
          import stat
          import sys

          path = sys.argv[1]
          keys = (
              "NPCINK_CLOUD_INTERNAL_AUTH_TOKEN",
              "NPCINK_CLOUD_ADMIN_KEY",
              "NPCINK_CLOUD_RELEASE_MEMBER_EMAIL",
              "NPCINK_CLOUD_PORTAL_LOGIN_CODE",
              "NPCINK_CLOUD_RELEASE_SITE_ID",
              "NPCINK_CLOUD_RELEASE_KEY_ID",
              "NPCINK_CLOUD_RELEASE_KEY_SECRET",
          )
          payload = {key: os.environ[key] for key in keys}
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=True, sort_keys=True, separators=(",", ":"))
              handle.write("\n")
          metadata = os.lstat(path)
          if not stat.S_ISREG(metadata.st_mode) or stat.S_IMODE(metadata.st_mode) != 0o600:
              raise SystemExit("[fail] Formal smoke credentials are not a regular mode-0600 file.")
          if metadata.st_uid != os.geteuid():
              raise SystemExit("[fail] Formal smoke credentials have the wrong owner.")
          PY
          unset \
            NPCINK_CLOUD_INTERNAL_AUTH_TOKEN \
            NPCINK_CLOUD_ADMIN_KEY \
            NPCINK_CLOUD_RELEASE_MEMBER_EMAIL \
            NPCINK_CLOUD_PORTAL_LOGIN_CODE \
            NPCINK_CLOUD_RELEASE_SITE_ID \
            NPCINK_CLOUD_RELEASE_KEY_ID \
            NPCINK_CLOUD_RELEASE_KEY_SECRET
          bash deploy/release-smoke.sh --base-url "${NPCINK_CLOUD_BASE_URL}" \
            --credentials-file "${credential_file}"

      - name: Record deferred formal release smoke
        if: steps.deploy.outputs.installation_state == 'complete' && steps.deploy.outputs.health_profile == 'runtime' && inputs.run_formal_release_smoke == false
        run: |
          {
            echo "## Formal Release Smoke"
            echo ""
            echo "Not selected for this deploy. This is not passing formal-smoke evidence."
            echo "For real SMTP, refresh the one-time Portal login code only after deployment, then immediately dispatch the fail-closed Release Smoke workflow from production."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Record plan-scoped verification
        if: steps.deploy.outputs.health_profile != 'runtime'
        run: |
          {
            echo "## Plan-scoped Production Verification"
            echo ""
            echo "- lane=${{ steps.deploy.outputs.release_lane }}"
            echo "- action=${{ steps.deploy.outputs.release_action }}"
            echo "- health_profile=${{ steps.deploy.outputs.health_profile }}"
            echo "- formal_smoke=not_applicable"
          } >> "${GITHUB_STEP_SUMMARY}"
