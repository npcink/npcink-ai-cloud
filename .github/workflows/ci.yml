name: Cloud CI

on:
  push:
    branches: [master, main, production]
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: cloud-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authoritative-cve-precheck:
    name: Authoritative CVE range precheck
    needs: [classify]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/production') || (github.event_name == 'pull_request' && github.base_ref == 'production') || needs.classify.outputs.authoritative_cve_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify CNA ranges before image work
        run: python3 scripts/check-authoritative-cve-ranges.py

  dockerfile-copy-precheck:
    name: Dockerfile COPY contract precheck
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/production'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify local Dockerfile COPY sources before image work
        run: python3 scripts/check-dockerfile-copy-contract.py

  production-pr-base-precheck:
    name: Production PR base contract precheck
    if: github.event_name == 'pull_request' && github.base_ref == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify production PR base, head, and approval contract
        run: python3 scripts/check-production-pr-base.py --event "${{ github.event_path }}" --repository "${GITHUB_REPOSITORY}"

  production-release-plan:
    name: Production release plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    outputs:
      release_action: ${{ steps.release_plan.outputs.action }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create exact production release plan
        id: release_plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha="${BEFORE_SHA}"
          if [ -z "${base_sha}" ] || [[ "${base_sha}" =~ ^0+$ ]]; then
            base_sha="0000000000000000000000000000000000000000"
            mapfile -t changed_files < <(
              git diff-tree --root --no-commit-id --name-only -r --diff-filter=ACMRD "${GITHUB_SHA}"
            )
          else
            mapfile -t changed_files < <(
              git diff --no-renames --name-only --diff-filter=ACMRD \
                "${base_sha}" "${GITHUB_SHA}"
            )
          fi

          mkdir -p artifacts/production-release-plan
          python3 scripts/production-release-plan.py \
            --repository "${GITHUB_REPOSITORY}" \
            --base-sha "${base_sha}" \
            --head-sha "${GITHUB_SHA}" \
            --head-tree "$(git rev-parse "${GITHUB_SHA}^{tree}")" \
            --source-root "${GITHUB_WORKSPACE}" \
            --image-platform linux/amd64 \
            --package-extras '[zilliz]' \
            --output artifacts/production-release-plan/production-release-plan.json \
            -- \
            "${changed_files[@]}"
          cat artifacts/production-release-plan/production-release-plan.json \
            >> "${GITHUB_STEP_SUMMARY}"
          python3 scripts/resolve-production-release-action.py \
            --plan artifacts/production-release-plan/production-release-plan.json \
            --repository "${GITHUB_REPOSITORY}" \
            --head-sha "${GITHUB_SHA}" \
            --head-tree "$(git rev-parse "${GITHUB_SHA}^{tree}")" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Upload exact production release plan
        uses: actions/upload-artifact@v7
        with:
          name: production-release-plan-${{ github.sha }}
          path: artifacts/production-release-plan/production-release-plan.json
          if-no-files-found: error
          retention-days: 14

  production-promotion-evidence:
    name: Production PR CI evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    outputs:
      pull_request_number: ${{ steps.verify.outputs.pull_request_number }}
      source_ci_run_id: ${{ steps.verify.outputs.source_ci_run_id }}
      tested_tree: ${{ steps.verify.outputs.tested_tree }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify merged production PR CI evidence
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_EVIDENCE_MAX_ATTEMPTS: "5"
          PRODUCTION_EVIDENCE_MAX_EXTERNAL_FAILURES: "2"
          PRODUCTION_EVIDENCE_RETRY_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          evidence_dir="$(mktemp -d "${RUNNER_TEMP}/production-pr-evidence.XXXXXX")"
          trap 'rm -rf "${evidence_dir}"' EXIT

          gh api "repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}" \
            > "${evidence_dir}/production-commit.json"
          [[ "${PRODUCTION_EVIDENCE_MAX_ATTEMPTS}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PRODUCTION_EVIDENCE_MAX_EXTERNAL_FAILURES}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PRODUCTION_EVIDENCE_RETRY_DELAY_SECONDS}" =~ ^[1-9][0-9]*$ ]]
          verified=false
          pr_number=""
          pr_head_sha=""
          pr_head_ref=""
          source_ci_run_id=""
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          graphql_query='query($owner:String!,$name:String!,$oid:GitObjectID!){repository(owner:$owner,name:$name){object(oid:$oid){... on Commit{associatedPullRequests(first:100){totalCount nodes{number mergedAt mergeCommit{oid} baseRefName headRefName headRefOid headRepository{nameWithOwner}}}}}}}'
          last_retry_reason="production PR association is not visible"
          last_external_failure_signature=""
          consecutive_external_failures=0
          for ((attempt = 1; attempt <= PRODUCTION_EVIDENCE_MAX_ATTEMPTS; attempt++)); do
            external_failure_signature=""
            rm -rf "${evidence_dir}/download"
            mkdir -p "${evidence_dir}/download"
            if ! gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              > "${evidence_dir}/associated-pulls.json"; then
              last_retry_reason="production PR association API is unavailable"
              external_failure_signature="associated-pulls-api"
            else
              matching_prs="$(
                jq -c --arg repository "${GITHUB_REPOSITORY}" --arg sha "${GITHUB_SHA}" '
                  [ .[]
                    | select(.base.ref == "production")
                    | select(.merged_at != null)
                    | select(.merge_commit_sha == $sha)
                    | select(.head.repo.full_name == $repository)
                  ]
                ' "${evidence_dir}/associated-pulls.json"
              )"
              matching_pr_count="$(jq 'length' <<<"${matching_prs}")"
              if [ "${matching_pr_count}" -eq 0 ]; then
                if ! gh api graphql \
                  -f query="${graphql_query}" \
                  -F owner="${repository_owner}" \
                  -F name="${repository_name}" \
                  -F oid="${GITHUB_SHA}" \
                  > "${evidence_dir}/associated-pulls-graphql.json"; then
                  last_retry_reason="production PR GraphQL association API is unavailable"
                  external_failure_signature="associated-pulls-graphql-api"
                elif ! jq -e \
                  '((.errors // []) | length == 0) and
                   (.data.repository.object.associatedPullRequests != null) and
                   (.data.repository.object.associatedPullRequests.totalCount <= 100)' \
                  "${evidence_dir}/associated-pulls-graphql.json" >/dev/null; then
                  last_retry_reason="production PR GraphQL association response is invalid"
                  external_failure_signature="associated-pulls-graphql-shape"
                else
                  jq '[.data.repository.object.associatedPullRequests.nodes[] |
                    {
                      number,
                      base: {ref: .baseRefName},
                      head: {
                        sha: .headRefOid,
                        ref: .headRefName,
                        repo: {full_name: .headRepository.nameWithOwner}
                      },
                      merged_at: .mergedAt,
                      merge_commit_sha: .mergeCommit.oid
                    }]' \
                    "${evidence_dir}/associated-pulls-graphql.json" \
                    > "${evidence_dir}/associated-pulls.json"
                  matching_prs="$(
                    jq -c --arg repository "${GITHUB_REPOSITORY}" --arg sha "${GITHUB_SHA}" '
                      [ .[]
                        | select(.base.ref == "production")
                        | select(.merged_at != null)
                        | select(.merge_commit_sha == $sha)
                        | select(.head.repo.full_name == $repository)
                      ]
                    ' "${evidence_dir}/associated-pulls.json"
                  )"
                  matching_pr_count="$(jq 'length' <<<"${matching_prs}")"
                fi
              fi
              if [ "${matching_pr_count}" -gt 1 ]; then
                echo "[fail] Production commit matched more than one merged same-repository production PR." >&2
                exit 1
              fi
              if [ "${matching_pr_count}" -eq 0 ]; then
                if [ -z "${external_failure_signature}" ]; then
                  last_retry_reason="production PR association is not visible"
                fi
              else
                pr_number="$(jq -r '.[0].number' <<<"${matching_prs}")"
                pr_head_sha="$(jq -r '.[0].head.sha' <<<"${matching_prs}")"
                pr_head_ref="$(jq -r '.[0].head.ref' <<<"${matching_prs}")"
                [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]]
                [[ "${pr_head_sha}" =~ ^[0-9a-f]{40}$ ]]
                test -n "${pr_head_ref}"

                if ! gh api --method GET \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
                  -f branch="${pr_head_ref}" \
                  -f event=pull_request \
                  -f status=completed \
                  -f per_page=100 \
                  > "${evidence_dir}/workflow-runs.json"; then
                  last_retry_reason="production PR workflow run API is unavailable"
                  external_failure_signature="workflow-runs-api"
                else
                  artifact_name="production-pr-ci-evidence-${pr_number}-${pr_head_sha}"
                  mapfile -t run_ids < <(
                    jq -r --arg sha "${pr_head_sha}" '
                      .workflow_runs[]
                      | select(.head_sha == $sha)
                      | select(.event == "pull_request")
                      | select(.conclusion == "success")
                      | .id
                    ' "${evidence_dir}/workflow-runs.json"
                  )
                  if [ "${#run_ids[@]}" -eq 0 ]; then
                    last_retry_reason="successful production PR CI run is not visible"
                  else
                    downloaded_artifacts=0
                    identity_failures=0
                    for run_id in "${run_ids[@]}"; do
                      rm -rf "${evidence_dir}/download"
                      mkdir -p "${evidence_dir}/download"
                      if ! gh api --method GET \
                        "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
                        -f per_page=100 \
                        > "${evidence_dir}/run-artifacts.json"; then
                        last_retry_reason="production PR CI artifact inventory API is unavailable"
                        external_failure_signature="artifact-inventory-api:${run_id}"
                        break
                      fi
                      matching_artifact_count="$(
                        jq --arg name "${artifact_name}" \
                          '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
                          "${evidence_dir}/run-artifacts.json"
                      )"
                      if [ "${matching_artifact_count}" -gt 1 ]; then
                        echo "[fail] Production PR CI run exposed duplicate reusable evidence artifacts." >&2
                        exit 1
                      fi
                      if [ "${matching_artifact_count}" -eq 0 ]; then
                        continue
                      fi
                      if ! gh run download "${run_id}" \
                        --repo "${GITHUB_REPOSITORY}" \
                        --name "${artifact_name}" \
                        --dir "${evidence_dir}/download" >/dev/null 2>&1; then
                        last_retry_reason="production PR CI evidence artifact download failed"
                        external_failure_signature="artifact-download:${run_id}"
                        break
                      fi
                      downloaded_artifacts=$((downloaded_artifacts + 1))
                      if ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                        > "${evidence_dir}/ci-run.json"; then
                        last_retry_reason="production PR CI run metadata API is unavailable"
                        external_failure_signature="run-metadata-api:${run_id}"
                        break
                      fi
                      if python3 scripts/production-ci-evidence.py verify \
                        --repository "${GITHUB_REPOSITORY}" \
                        --production-sha "${GITHUB_SHA}" \
                        --production-commit "${evidence_dir}/production-commit.json" \
                        --associated-pulls "${evidence_dir}/associated-pulls.json" \
                        --ci-run "${evidence_dir}/ci-run.json" \
                        --receipt "${evidence_dir}/download/production-pr-ci-evidence.json" \
                        --output "${evidence_dir}/verification.json"; then
                        verified=true
                        source_ci_run_id="${run_id}"
                        break
                      fi
                      identity_failures=$((identity_failures + 1))
                    done
                    if [ "${verified}" = "true" ]; then
                      break
                    fi
                    if [ "${identity_failures}" -gt 0 ]; then
                      echo "[fail] Downloaded production PR CI evidence failed identity or tested-tree verification." >&2
                      exit 1
                    fi
                    if [ -z "${external_failure_signature}" ] && [ "${downloaded_artifacts}" -eq 0 ]; then
                      last_retry_reason="production PR CI evidence artifact is not visible"
                    elif [ -z "${external_failure_signature}" ]; then
                      last_retry_reason="production PR CI evidence is not yet verifiable"
                    fi
                  fi
                fi
              fi
            fi
            if [ -n "${external_failure_signature}" ]; then
              if [ "${external_failure_signature}" = "${last_external_failure_signature}" ]; then
                consecutive_external_failures=$((consecutive_external_failures + 1))
              else
                last_external_failure_signature="${external_failure_signature}"
                consecutive_external_failures=1
              fi
              if [ "${consecutive_external_failures}" -ge "${PRODUCTION_EVIDENCE_MAX_EXTERNAL_FAILURES}" ]; then
                echo "[fail] Production PR CI evidence external operation failed ${consecutive_external_failures} consecutive times with signature ${external_failure_signature}; automatic retries stopped." >&2
                exit 1
              fi
            else
              last_external_failure_signature=""
              consecutive_external_failures=0
            fi
            if [ "${attempt}" -eq "${PRODUCTION_EVIDENCE_MAX_ATTEMPTS}" ]; then
              echo "[fail] Production PR CI evidence remained unavailable after ${attempt} attempts: ${last_retry_reason}." >&2
              exit 1
            fi
            echo "[info] Production PR CI evidence attempt ${attempt}/${PRODUCTION_EVIDENCE_MAX_ATTEMPTS} is pending: ${last_retry_reason}; retrying in ${PRODUCTION_EVIDENCE_RETRY_DELAY_SECONDS}s."
            sleep "${PRODUCTION_EVIDENCE_RETRY_DELAY_SECONDS}"
          done
          test "${verified}" = "true"

          tested_tree="$(jq -r '.production_tree' "${evidence_dir}/verification.json")"
          {
            echo "pull_request_number=${pr_number}"
            echo "source_ci_run_id=${source_ci_run_id}"
            echo "tested_tree=${tested_tree}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "## Production PR CI Evidence"
            echo ""
            echo "- production_sha=${GITHUB_SHA}"
            echo "- production_tree=${tested_tree}"
            echo "- production_pr=${pr_number}"
            echo "- reused_ci_run=${source_ci_run_id}"
            echo "- evidence_reused=true"
          } >> "${GITHUB_STEP_SUMMARY}"

  production-deploy-bundle:
    name: Production deploy bundle
    needs: [authoritative-cve-precheck, dockerfile-copy-precheck, production-release-plan, production-promotion-evidence]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production' && needs.production-release-plan.outputs.release_action == 'runtime'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download exact production release plan
        uses: actions/download-artifact@v7
        with:
          name: production-release-plan-${{ github.sha }}
          path: ${{ runner.temp }}/production-release-plan

      - name: Resolve exact application image fingerprints
        id: application_image_inputs
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/production-release-plan/production-release-plan.json"
          api_fingerprint="$(jq -er '.application_image_inputs.images[] | select(.key == "api") | .fingerprint' "${plan}")"
          frontend_fingerprint="$(jq -er '.application_image_inputs.images[] | select(.key == "frontend") | .fingerprint' "${plan}")"
          [[ "${api_fingerprint}" =~ ^[0-9a-f]{64}$ ]] || exit 64
          [[ "${frontend_fingerprint}" =~ ^[0-9a-f]{64}$ ]] || exit 64
          echo "api_fingerprint=${api_fingerprint}" >> "${GITHUB_OUTPUT}"
          echo "frontend_fingerprint=${frontend_fingerprint}" >> "${GITHUB_OUTPUT}"

      - name: Restore exact API application image
        id: api_application_image_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/production-application-image-cache/api
          key: production-application-image-v1-linux-amd64-api-${{ steps.application_image_inputs.outputs.api_fingerprint }}-${{ github.run_id }}
          restore-keys: |
            production-application-image-v1-linux-amd64-api-${{ steps.application_image_inputs.outputs.api_fingerprint }}-

      - name: Restore exact frontend application image
        id: frontend_application_image_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/production-application-image-cache/frontend
          key: production-application-image-v1-linux-amd64-frontend-${{ steps.application_image_inputs.outputs.frontend_fingerprint }}-${{ github.run_id }}
          restore-keys: |
            production-application-image-v1-linux-amd64-frontend-${{ steps.application_image_inputs.outputs.frontend_fingerprint }}-

      - name: Restore disposable production image scan evidence
        id: production_scan_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/production-image-scan-cache/evidence
          key: production-image-scan-v1-linux-amd64-${{ hashFiles('deploy/image-lock/production-images.json', 'deploy/image-lock/cve-allowlist.json', 'deploy/image-lock/authoritative-not-affected.json') }}-${{ github.run_id }}
          restore-keys: |
            production-image-scan-v1-linux-amd64-${{ hashFiles('deploy/image-lock/production-images.json', 'deploy/image-lock/cve-allowlist.json', 'deploy/image-lock/authoritative-not-affected.json') }}-

      - name: Prepare disposable production image scan cache
        run: |
          set -euo pipefail
          cache_root="${RUNNER_TEMP}/production-image-scan-cache"
          if [ -d "${cache_root}/evidence" ]; then
            mv "${cache_root}/evidence" "${cache_root}/reuse"
          fi
          mkdir -p "${cache_root}/evidence"

      - name: Build and scan exact production deploy bundle
        id: build_bundle
        env:
          NPCINK_CLOUD_INCLUDE_EXTERNAL_IMAGES: "1"
          NPCINK_CLOUD_IMAGE_PLATFORM: linux/amd64
          NPCINK_CLOUD_PACKAGE_EXTRAS: "[zilliz]"
          NPCINK_CLOUD_RELEASE_BUNDLE_SCHEMA_VERSION: "npcink.release-bundle.v2"
          NPCINK_CLOUD_PRODUCTION_RELEASE_PLAN_FILE: ${{ runner.temp }}/production-release-plan/production-release-plan.json
          NPCINK_CLOUD_SCAN_REUSE_DIR: ${{ runner.temp }}/production-image-scan-cache/reuse
          NPCINK_CLOUD_SCAN_CACHE_OUTPUT_DIR: ${{ runner.temp }}/production-image-scan-cache/evidence
          NPCINK_CLOUD_APPLICATION_IMAGE_CACHE_ROOT: ${{ runner.temp }}/production-application-image-cache
        run: bash deploy/bundle-images.sh

      - name: Save exact API application image
        if: steps.build_bundle.outputs.api_cache_save == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/production-application-image-cache/api
          key: production-application-image-v1-linux-amd64-api-${{ steps.application_image_inputs.outputs.api_fingerprint }}-${{ github.run_id }}

      - name: Save exact frontend application image
        if: steps.build_bundle.outputs.frontend_cache_save == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/production-application-image-cache/frontend
          key: production-application-image-v1-linux-amd64-frontend-${{ steps.application_image_inputs.outputs.frontend_fingerprint }}-${{ github.run_id }}

      - name: Save disposable production image scan evidence
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/production-image-scan-cache/evidence
          key: production-image-scan-v1-linux-amd64-${{ hashFiles('deploy/image-lock/production-images.json', 'deploy/image-lock/cve-allowlist.json', 'deploy/image-lock/authoritative-not-affected.json') }}-${{ github.run_id }}

      - name: Upload exact production deploy bundle
        uses: actions/upload-artifact@v7
        with:
          name: production-deploy-bundle-${{ github.sha }}
          path: |
            dist/deploy-bundle.tgz
            dist/deploy-bundle.tgz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  classify:
    runs-on: ubuntu-latest
    outputs:
      deploy_required: ${{ steps.changed.outputs.deploy_required }}
      authoritative_cve_required: ${{ steps.changed.outputs.authoritative_cve_required }}
      static_terms_only: ${{ steps.changed.outputs.static_terms_only }}
      docs_only: ${{ steps.changed.outputs.docs_only }}
      frontend_only: ${{ steps.changed.outputs.frontend_only }}
      frontend_required: ${{ steps.changed.outputs.frontend_required }}
      frontend_backend_contracts_required: ${{ steps.changed.outputs.frontend_backend_contracts_required }}
      frontend_e2e_required: ${{ steps.changed.outputs.frontend_e2e_required }}
      specialized_quality_required: ${{ steps.changed.outputs.specialized_quality_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            mapfile -t changed_files < <(
              git diff --name-only --diff-filter=ACMRD "${BASE_SHA}...${HEAD_SHA}"
            )
          elif [ -n "${BEFORE_SHA}" ] && [[ ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            mapfile -t changed_files < <(
              git diff --name-only --diff-filter=ACMRD "${BEFORE_SHA}...${HEAD_SHA}"
            )
          else
            mapfile -t changed_files < <(
              git show --pretty='' --name-only --diff-filter=ACMRD "${HEAD_SHA}"
            )
          fi

          bash scripts/classify-ci-changes.sh "${changed_files[@]}" \
            | tee -a "${GITHUB_OUTPUT}"

          specialized_quality_required="$(
            python3 scripts/check_changed.py --plan --format json "${changed_files[@]}" \
              | python3 -c 'import json,sys; print("true" if json.load(sys.stdin)["specialized_commands"] else "false")'
          )"
          echo "specialized_quality_required=${specialized_quality_required}" \
            | tee -a "${GITHUB_OUTPUT}"

  specialized-quality:
    name: Specialized changed-domain quality gates
    needs: [classify]
    if: github.event_name == 'pull_request' && needs.classify.outputs.specialized_quality_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Bootstrap Cloud Dev Environment
        run: make bootstrap-dev

      - name: Run specialized changed-domain gates
        env:
          NPCINK_CLOUD_PR_BASE_REF: origin/${{ github.base_ref }}
        run: >-
          python3 scripts/check_changed.py
          --specialized-only
          --base "${NPCINK_CLOUD_PR_BASE_REF}"

  backend-scope:
    needs: [classify]
    if: (github.event_name != 'push' || github.ref != 'refs/heads/production') && needs.classify.outputs.static_terms_only != 'true'
    runs-on: ubuntu-latest
    outputs:
      requires_full_backend: ${{ steps.scope.outputs.requires_full_backend || steps.docs_scope.outputs.requires_full_backend || steps.frontend_scope.outputs.requires_full_backend }}
    steps:
      - name: Checkout
        if: github.base_ref == 'production' || (needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.frontend_only != 'true')
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify backend gate scope
        id: scope
        if: github.base_ref == 'production' || (needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.frontend_only != 'true')
        run: bash scripts/check-pr-backend-gate.sh --classify-only

      - name: Select docs-only backend gate
        id: docs_scope
        if: github.base_ref != 'production' && needs.classify.outputs.docs_only == 'true'
        run: echo "requires_full_backend=0" >> "${GITHUB_OUTPUT}"

      - name: Select frontend-only backend gate
        id: frontend_scope
        if: github.base_ref != 'production' && needs.classify.outputs.frontend_only == 'true'
        run: echo "requires_full_backend=0" >> "${GITHUB_OUTPUT}"

  python-dependency-audit:
    name: Python dependency audit
    needs: [classify]
    if: (github.event_name != 'push' || github.ref != 'refs/heads/production') && needs.classify.outputs.static_terms_only != 'true' && needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.frontend_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.29

      - name: Audit locked production Python dependencies
        run: bash scripts/check-python-dependency-audit.sh

  production-python-image-smoke:
    name: Python 3.14 Alpine production image smoke
    needs: [classify, backend-scope]
    if: github.event_name == 'pull_request' && needs.classify.outputs.static_terms_only != 'true' && needs['backend-scope'].outputs.requires_full_backend == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python for pinned uvx
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install pinned uv
        run: python -m pip install uv==0.11.29

      - name: Build and verify Python 3.14 Alpine production images
        run: bash scripts/production-python-extras-smoke.sh

  backend-targeted:
    needs: [classify, backend-scope]
    if: github.event_name == 'pull_request' && needs.classify.outputs.static_terms_only != 'true' && needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.frontend_only != 'true' && needs['backend-scope'].outputs.requires_full_backend != '1'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: static
            command: --targeted-static
            needs_node: true
          - lane: contract-1
            command: --targeted-contract-shard 1
            needs_node: false
          - lane: contract-2
            command: --targeted-contract-shard 2
            needs_node: false
          - lane: contract-3
            command: --targeted-contract-shard 3
            needs_node: false
          - lane: impacted
            command: --targeted-impacted
            needs_node: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup pnpm
        if: matrix.needs_node
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        if: matrix.needs_node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Bootstrap backend test environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e '.[dev]'

      - name: Targeted backend ${{ matrix.lane }} lane
        run: bash scripts/check-pr-backend-gate.sh ${{ matrix.command }}

  backend-docs:
    needs: [classify, backend-scope]
    if: (github.event_name != 'push' || github.ref != 'refs/heads/production') && needs.classify.outputs.static_terms_only != 'true' && needs.classify.outputs.docs_only == 'true' && needs['backend-scope'].outputs.requires_full_backend != '1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Docs-only backend gate
        env:
          NPCINK_CLOUD_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          NPCINK_CLOUD_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/check-docs-only.sh

  backend-static:
    needs: [classify, backend-scope]
    if: (github.event_name != 'push' || github.ref != 'refs/heads/production') && needs.classify.outputs.static_terms_only != 'true' && needs['backend-scope'].outputs.requires_full_backend == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Bootstrap Cloud Dev Environment
        run: make bootstrap-dev

      - name: Anti Drift Unit
        run: pnpm run test:anti-drift

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Mypy
        run: .venv/bin/mypy app

  backend-pytest:
    needs: [classify, backend-scope]
    if: (github.event_name != 'push' || github.ref != 'refs/heads/production') && needs.classify.outputs.static_terms_only != 'true' && needs['backend-scope'].outputs.requires_full_backend == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Bootstrap Cloud Dev Environment
        run: make bootstrap-dev

      - name: Select pytest shard
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/select-pytest-shard.py \
            --shards 4 \
            --shard "${{ matrix.shard }}" \
            --collected-item-floor-seconds 1.0 \
            tests/api tests/contract tests/domain \
            > "artifacts/pytest-files-shard-${{ matrix.shard }}.txt"
          echo "## Pytest Shard ${{ matrix.shard }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Selected files:" >> "${GITHUB_STEP_SUMMARY}"
          sed 's/^/- `/' "artifacts/pytest-files-shard-${{ matrix.shard }}.txt" \
            | sed 's/$/`/' >> "${GITHUB_STEP_SUMMARY}"

      - name: Pytest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t pytest_files < "artifacts/pytest-files-shard-${{ matrix.shard }}.txt"
          if [ "${#pytest_files[@]}" -eq 0 ]; then
            echo "No pytest files selected for shard ${{ matrix.shard }}." >&2
            exit 1
          fi
          pytest_args=(
            "${pytest_files[@]}"
            -v
            "--junitxml=artifacts/pytest-backend-shard-${{ matrix.shard }}.xml"
            --durations=25
          )
          changed_app_files=()
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            while IFS= read -r changed_path; do
              changed_app_files+=("${changed_path}")
            done < <(
              git diff --name-only --diff-filter=ACMR "${BASE_SHA}...${HEAD_SHA}" \
                -- 'app/*.py' 'app/**/*.py'
            )
          fi
          if [ "${#changed_app_files[@]}" -gt 0 ]; then
            uv pip install --python .venv/bin/python 'coverage==7.15.2'
            coverage_include_paths=("app/__init__.py" "${changed_app_files[@]}")
            coverage_include_arg="$(IFS=,; echo "${coverage_include_paths[*]}")"
            COVERAGE_FILE="artifacts/coverage-backend-shard-${{ matrix.shard }}.data" \
              timeout --signal=INT --kill-after=30s 1200 .venv/bin/python -m coverage run --branch \
              --include="${coverage_include_arg}" \
              -m pytest "${pytest_args[@]}"
          else
          timeout --signal=INT --kill-after=30s 1200 .venv/bin/python -m pytest "${pytest_args[@]}"
          fi

      - name: Summarize pytest timing
        if: always()
        run: |
          if [ -f "artifacts/pytest-backend-shard-${{ matrix.shard }}.xml" ]; then
            python3 scripts/report-junit-timing.py "artifacts/pytest-backend-shard-${{ matrix.shard }}.xml" --top 25 \
              >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "## Pytest Timing Report" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "Pytest timing artifact was not produced." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload pytest timing artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-backend-timing-shard-${{ matrix.shard }}
          path: |
            artifacts/pytest-backend-shard-${{ matrix.shard }}.xml
            artifacts/pytest-files-shard-${{ matrix.shard }}.txt
          if-no-files-found: ignore

      - name: Upload pytest coverage artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pytest-backend-coverage-shard-${{ matrix.shard }}
          path: artifacts/coverage-backend-shard-${{ matrix.shard }}.data
          if-no-files-found: ignore

  backend-postgres-cutover:
    name: PostgreSQL 16 encryption cutover regression
    needs: [classify, backend-scope]
    if: (github.event_name != 'push' || github.ref != 'refs/heads/production') && needs.classify.outputs.static_terms_only != 'true' && needs['backend-scope'].outputs.requires_full_backend == '1'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned uv
        run: python -m pip install uv==0.11.29

      - name: Bootstrap backend test environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e '.[dev]'

      - name: Verify 0058-to-0068 cutover on PostgreSQL 16
        env:
          NPCINK_CLOUD_P1_E06_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          .venv/bin/python -m pytest -q
          tests/integration/test_runtime_data_encryption_0058_to_0068.py

  backend:
    name: backend
    needs: [classify, specialized-quality, backend-scope, python-dependency-audit, production-python-image-smoke, backend-targeted, backend-docs, backend-static, backend-pytest, backend-postgres-cutover, production-pr-base-precheck, authoritative-cve-precheck, dockerfile-copy-precheck]
    if: always() && (github.event_name != 'push' || github.ref != 'refs/heads/production') && needs.classify.outputs.static_terms_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify backend gate result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          BACKEND_SCOPE_RESULT: ${{ needs['backend-scope'].result }}
          PYTHON_DEPENDENCY_AUDIT_RESULT: ${{ needs['python-dependency-audit'].result }}
          PRODUCTION_PYTHON_IMAGE_SMOKE_RESULT: ${{ needs['production-python-image-smoke'].result }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          AUTHORITATIVE_CVE_REQUIRED: ${{ needs.classify.outputs.authoritative_cve_required }}
          BACKEND_TARGETED_RESULT: ${{ needs['backend-targeted'].result }}
          BACKEND_DOCS_RESULT: ${{ needs['backend-docs'].result }}
          BACKEND_STATIC_RESULT: ${{ needs['backend-static'].result }}
          BACKEND_PYTEST_RESULT: ${{ needs['backend-pytest'].result }}
          BACKEND_POSTGRES_CUTOVER_RESULT: ${{ needs['backend-postgres-cutover'].result }}
          PRODUCTION_PR_BASE_RESULT: ${{ needs['production-pr-base-precheck'].result }}
          AUTHORITATIVE_CVE_RESULT: ${{ needs['authoritative-cve-precheck'].result }}
          DOCKERFILE_COPY_RESULT: ${{ needs['dockerfile-copy-precheck'].result }}
          REQUIRES_FULL_BACKEND: ${{ needs['backend-scope'].outputs.requires_full_backend }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          FRONTEND_ONLY: ${{ needs.classify.outputs.frontend_only }}
          SPECIALIZED_QUALITY_REQUIRED: ${{ needs.classify.outputs.specialized_quality_required }}
          SPECIALIZED_QUALITY_RESULT: ${{ needs['specialized-quality'].result }}
        run: |
          set -euo pipefail
          if [ "${CLASSIFY_RESULT}" != "success" ]; then
            echo "CI change classification did not pass" >&2
            exit 1
          fi

          echo "scope=${BACKEND_SCOPE_RESULT}"
          echo "python_dependency_audit=${PYTHON_DEPENDENCY_AUDIT_RESULT}"
          echo "production_python_image_smoke=${PRODUCTION_PYTHON_IMAGE_SMOKE_RESULT}"
          echo "targeted=${BACKEND_TARGETED_RESULT}"
          echo "docs=${BACKEND_DOCS_RESULT}"
          echo "static=${BACKEND_STATIC_RESULT}"
          echo "pytest=${BACKEND_PYTEST_RESULT}"
          echo "postgres_cutover=${BACKEND_POSTGRES_CUTOVER_RESULT}"
          echo "production_pr_base=${PRODUCTION_PR_BASE_RESULT}"
          echo "authoritative_cve=${AUTHORITATIVE_CVE_RESULT}"
          echo "dockerfile_copy=${DOCKERFILE_COPY_RESULT}"
          echo "specialized_quality=${SPECIALIZED_QUALITY_RESULT}"
          echo "requires_full_backend=${REQUIRES_FULL_BACKEND}"

          if [ "${BACKEND_SCOPE_RESULT}" != "success" ]; then
            echo "backend scope classification did not pass" >&2
            exit 1
          fi

          if [ "${GITHUB_REF}" = "refs/heads/production" ] || { [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "${GITHUB_BASE_REF}" = "production" ]; } || [ "${AUTHORITATIVE_CVE_REQUIRED}" = "true" ]; then
            if [ "${AUTHORITATIVE_CVE_RESULT}" != "success" ]; then
              echo "authoritative CVE precheck did not pass" >&2
              exit 1
            fi
          elif [ "${AUTHORITATIVE_CVE_RESULT}" != "skipped" ]; then
            echo "authoritative CVE precheck should be skipped for non-release changes" >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/master" ] || [ "${GITHUB_REF}" = "refs/heads/production" ]; then
            if [ "${DOCKERFILE_COPY_RESULT}" != "success" ]; then
              echo "Dockerfile COPY precheck did not pass" >&2
              exit 1
            fi
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "${GITHUB_BASE_REF}" = "production" ] && [ "${PRODUCTION_PR_BASE_RESULT}" != "success" ]; then
            echo "production PR base precheck did not pass" >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if [ "${SPECIALIZED_QUALITY_REQUIRED}" = "true" ]; then
              if [ "${SPECIALIZED_QUALITY_RESULT}" != "success" ]; then
                echo "specialized changed-domain quality gates did not pass" >&2
                exit 1
              fi
            elif [ "${SPECIALIZED_QUALITY_RESULT}" != "skipped" ]; then
              echo "specialized changed-domain quality gates should be skipped" >&2
              exit 1
            fi
          elif [ "${SPECIALIZED_QUALITY_RESULT}" != "skipped" ]; then
            echo "specialized changed-domain quality gates must stay PR-only" >&2
            exit 1
          fi

          if [ "${DOCS_ONLY}" = "true" ] || [ "${FRONTEND_ONLY}" = "true" ]; then
            if [ "${PYTHON_DEPENDENCY_AUDIT_RESULT}" != "skipped" ]; then
              echo "python dependency audit should be skipped for docs-only or frontend-only changes" >&2
              exit 1
            fi
          elif [ "${PYTHON_DEPENDENCY_AUDIT_RESULT}" != "success" ]; then
              echo "python dependency audit did not pass" >&2
              exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "${REQUIRES_FULL_BACKEND}" = "1" ]; then
            if [ "${PRODUCTION_PYTHON_IMAGE_SMOKE_RESULT}" != "success" ]; then
              echo "Python 3.14 Alpine production image smoke did not pass" >&2
              exit 1
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if [ "${PRODUCTION_PYTHON_IMAGE_SMOKE_RESULT}" != "skipped" ]; then
              echo "Python 3.14 Alpine production image smoke should be skipped for a targeted PR" >&2
              exit 1
            fi
          elif [ "${PRODUCTION_PYTHON_IMAGE_SMOKE_RESULT}" != "skipped" ] && [ "${PRODUCTION_PYTHON_IMAGE_SMOKE_RESULT}" != "success" ]; then
            echo "Python 3.14 Alpine production image smoke ended unexpectedly" >&2
            exit 1
          fi

          if [ "${REQUIRES_FULL_BACKEND}" = "1" ]; then
            if [ "${BACKEND_TARGETED_RESULT}" != "skipped" ]; then
              echo "targeted backend lanes should be skipped for a full backend gate" >&2
              exit 1
            fi
            if [ "${BACKEND_DOCS_RESULT}" != "skipped" ]; then
              echo "docs-only backend gate should be skipped for a full backend gate" >&2
              exit 1
            fi
            if [ "${BACKEND_STATIC_RESULT}" != "success" ]; then
              echo "backend static gate did not pass" >&2
              exit 1
            fi
            if [ "${BACKEND_PYTEST_RESULT}" != "success" ]; then
              echo "backend pytest shards did not pass" >&2
              exit 1
            fi
            if [ "${BACKEND_POSTGRES_CUTOVER_RESULT}" != "success" ]; then
              echo "PostgreSQL 16 encryption cutover regression did not pass" >&2
              exit 1
            fi
          else
            if [ "${BACKEND_POSTGRES_CUTOVER_RESULT}" != "skipped" ]; then
              echo "PostgreSQL 16 encryption cutover regression should be skipped for a targeted gate" >&2
              exit 1
            fi
            if [ "${DOCS_ONLY}" = "true" ]; then
              if [ "${BACKEND_DOCS_RESULT}" != "success" ]; then
                echo "docs-only backend gate did not pass" >&2
                exit 1
              fi
              if [ "${BACKEND_TARGETED_RESULT}" != "skipped" ]; then
                echo "targeted backend lanes should be skipped for docs-only changes" >&2
                exit 1
              fi
            elif [ "${BACKEND_DOCS_RESULT}" != "skipped" ]; then
              echo "docs-only backend gate should be skipped for non-doc changes" >&2
              exit 1
            fi
            if [ "${FRONTEND_ONLY}" = "true" ] && [ "${BACKEND_TARGETED_RESULT}" != "skipped" ]; then
              echo "targeted backend gate should be skipped for frontend-only changes" >&2
              exit 1
            elif [ "${FRONTEND_ONLY}" != "true" ] && [ "${DOCS_ONLY}" != "true" ] && [ "${BACKEND_TARGETED_RESULT}" != "success" ]; then
              echo "targeted backend gate did not pass" >&2
              exit 1
            fi
          fi

  frontend:
    needs: [classify]
    if: (github.event_name != 'push' || github.ref != 'refs/heads/production') && needs.classify.outputs.static_terms_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: github.event_name != 'pull_request' || github.base_ref == 'production' || needs.classify.outputs.frontend_required == 'true' || needs.classify.outputs.frontend_backend_contracts_required == 'true'
        uses: actions/checkout@v6

      - name: Setup pnpm
        if: github.event_name != 'pull_request' || github.base_ref == 'production' || needs.classify.outputs.frontend_required == 'true' || needs.classify.outputs.frontend_backend_contracts_required == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        if: github.event_name != 'pull_request' || github.base_ref == 'production' || needs.classify.outputs.frontend_required == 'true' || needs.classify.outputs.frontend_backend_contracts_required == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: github.event_name != 'pull_request' || github.base_ref == 'production' || needs.classify.outputs.frontend_required == 'true'
        run: pnpm install --frozen-lockfile --filter frontend...

      - name: Lint
        if: github.event_name != 'pull_request' || github.base_ref == 'production' || needs.classify.outputs.frontend_required == 'true'
        run: pnpm --dir frontend run lint

      - name: Type Check
        if: github.event_name != 'pull_request' || github.base_ref == 'production' || needs.classify.outputs.frontend_required == 'true'
        run: pnpm --dir frontend run type-check

      - name: Unit Tests
        if: github.event_name != 'pull_request' || github.base_ref == 'production' || needs.classify.outputs.frontend_required == 'true'
        run: pnpm --dir frontend run test:unit

      - name: Frontend Contracts
        if: github.event_name != 'pull_request' || github.base_ref == 'production' || needs.classify.outputs.frontend_required == 'true'
        run: pnpm --dir frontend run test:contracts

      - name: Backend-owned frontend contracts
        if: github.event_name == 'pull_request' && github.base_ref != 'production' && needs.classify.outputs.frontend_required != 'true' && needs.classify.outputs.frontend_backend_contracts_required == 'true'
        run: |
          node frontend/tests/unit/admin-accounts-queue-v2-contract.mjs
          node frontend/tests/unit/admin-coverage-workspace-contract.mjs

      - name: Install Playwright Chromium
        if: needs.classify.outputs.frontend_e2e_required == 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Critical frontend paths
        if: needs.classify.outputs.frontend_e2e_required == 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: >-
          node scripts/run-cloud-frontend-playwright.js
          test -c playwright.config.ts
          tests/e2e/admin-operator-path.spec.ts
          tests/e2e/portal-workspace-path.spec.ts
          --grep
          'admin operator path smoke|portal workspace interaction path|Alipay return polls|account projections remain available|account-level support stays available'

      - name: Unchanged frontend acknowledgement
        if: github.event_name == 'pull_request' && github.base_ref != 'production' && needs.classify.outputs.frontend_required != 'true' && needs.classify.outputs.frontend_backend_contracts_required != 'true'
        run: echo "Frontend source and toolchain are unchanged; the PR keeps the stable frontend check without reinstalling or retesting the frontend."

  static-terms:
    needs: [classify]
    if: (github.event_name != 'push' || github.ref != 'refs/heads/production') && needs.classify.outputs.static_terms_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static terms tree
        run: |
          set -euo pipefail
          bash scripts/check-release-policy.sh
          test -f site/terms/index.html
          test -f site/terms/en/terms.html
          test -f site/terms/zh/terms.html
          test -f site/terms/styles.css
          ! find site/terms -name '.DS_Store' -print -quit | grep -q .

  ci-observability:
    name: CI observability
    needs:
      - production-release-plan
      - production-promotion-evidence
      - production-deploy-bundle
      - secret-scan
      - classify
      - backend-scope
      - backend
      - frontend
      - static-terms
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python for changed-code coverage
        if: github.event_name == 'pull_request' && needs.backend.result == 'success' && needs['backend-scope'].outputs.requires_full_backend == '1'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Summarize CI timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python3 scripts/report-release-timing.py "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" >> "${GITHUB_STEP_SUMMARY}"; then
            echo "## Release Timing Report" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "Timing summary was unavailable for this run." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Verify production deploy bundle result
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        env:
          PRODUCTION_PR_EVIDENCE_RESULT: ${{ needs.production-promotion-evidence.result }}
          PRODUCTION_RELEASE_PLAN_RESULT: ${{ needs.production-release-plan.result }}
          PRODUCTION_RELEASE_ACTION: ${{ needs.production-release-plan.outputs.release_action }}
          PRODUCTION_DEPLOY_BUNDLE_RESULT: ${{ needs.production-deploy-bundle.result }}
        run: |
          set -euo pipefail
          test "${PRODUCTION_RELEASE_PLAN_RESULT}" = "success"
          test "${PRODUCTION_PR_EVIDENCE_RESULT}" = "success"
          case "${PRODUCTION_RELEASE_ACTION}" in
            runtime)
              test "${PRODUCTION_DEPLOY_BUNDLE_RESULT}" = "success"
              ;;
            no_deploy|static)
              test "${PRODUCTION_DEPLOY_BUNDLE_RESULT}" = "skipped"
              ;;
            *)
              echo "[fail] Unsupported production release action: ${PRODUCTION_RELEASE_ACTION}" >&2
              exit 1
              ;;
          esac

      - name: Create production PR CI evidence receipt
        if: github.event_name == 'pull_request' && github.base_ref == 'production'
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          STATIC_TERMS_RESULT: ${{ needs.static-terms.result }}
          STATIC_TERMS_ONLY: ${{ needs.classify.outputs.static_terms_only }}
          REQUIRES_FULL_BACKEND: ${{ needs['backend-scope'].outputs.requires_full_backend }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-pr-ci-evidence
          full_backend=false
          if [ "${REQUIRES_FULL_BACKEND}" = "1" ]; then
            full_backend=true
          fi
          python3 scripts/production-ci-evidence.py create \
            --repository "${GITHUB_REPOSITORY}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --tested-sha "$(git rev-parse HEAD)" \
            --tested-tree "$(git rev-parse HEAD^{tree})" \
            --static-terms-only "${STATIC_TERMS_ONLY}" \
            --full-backend "${full_backend}" \
            --secret-scan "${SECRET_SCAN_RESULT}" \
            --backend "${BACKEND_RESULT}" \
            --frontend "${FRONTEND_RESULT}" \
            --static-terms "${STATIC_TERMS_RESULT}" \
            --output artifacts/production-pr-ci-evidence/production-pr-ci-evidence.json

      - name: Upload production PR CI evidence receipt
        if: github.event_name == 'pull_request' && github.base_ref == 'production'
        uses: actions/upload-artifact@v7
        with:
          name: production-pr-ci-evidence-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/production-pr-ci-evidence/production-pr-ci-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Summarize pytest shard balance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          balance_dir="$(mktemp -d "${RUNNER_TEMP}/pytest-shard-balance.XXXXXX")"
          trap 'rm -rf "${balance_dir}"' EXIT
          if gh run download "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${balance_dir}" \
            --pattern 'pytest-backend-timing-shard-*' >/dev/null 2>&1; then
            if ! python3 scripts/report-pytest-shard-balance.py "${balance_dir}" \
              >> "${GITHUB_STEP_SUMMARY}"; then
              echo "## Pytest Shard Balance" >> "${GITHUB_STEP_SUMMARY}"
              echo "" >> "${GITHUB_STEP_SUMMARY}"
              echo "Pytest shard balance summary was unavailable." >> "${GITHUB_STEP_SUMMARY}"
            fi
          else
            echo "## Pytest Shard Balance" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "Pytest shard balance summary was unavailable because the full lane did not execute." \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Summarize changed-code coverage
        if: github.event_name == 'pull_request' && needs.backend.result == 'success' && needs['backend-scope'].outputs.requires_full_backend == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          coverage_root="$(mktemp -d "${RUNNER_TEMP}/changed-code-coverage.XXXXXX")"
          combine_dir="${coverage_root}/combine"
          report_dir="artifacts/changed-code-coverage"
          trap 'rm -rf "${coverage_root}"' EXIT
          mkdir -p "${combine_dir}" "${report_dir}"

          mapfile -t changed_app_files < <(
            git diff --name-only --diff-filter=ACMR "${BASE_SHA}...${HEAD_SHA}" \
              -- 'app/*.py' 'app/**/*.py'
          )
          if [ "${#changed_app_files[@]}" -eq 0 ]; then
            python3 scripts/report-changed-code-coverage.py \
              --base "${BASE_SHA}" \
              --head "${HEAD_SHA}" \
              --markdown-output "${report_dir}/changed-code-coverage.md" \
              --json-output "${report_dir}/changed-code-coverage.json"
            cat "${report_dir}/changed-code-coverage.md" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if gh run download "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${coverage_root}/download" \
            --pattern 'pytest-backend-coverage-shard-*' >/dev/null 2>&1; then
            mapfile -t coverage_files < <(
              find "${coverage_root}/download" -type f \
                -name 'coverage-backend-shard-*.data' -print | sort
            )
            if [ "${#coverage_files[@]}" -ne 4 ]; then
              echo "expected 4 backend coverage shard files, found ${#coverage_files[@]}" >&2
              exit 1
            fi
            for index in "${!coverage_files[@]}"; do
              cp "${coverage_files[$index]}" "${combine_dir}/.coverage.shard-$((index + 1))"
            done

            python -m pip install 'coverage==7.15.2'
            COVERAGE_FILE="${combine_dir}/.coverage" \
              python -m coverage combine "${combine_dir}"
            python3 scripts/report-changed-code-coverage.py \
              --coverage-data "${combine_dir}/.coverage" \
              --base "${BASE_SHA}" \
              --head "${HEAD_SHA}" \
              --markdown-output "${report_dir}/changed-code-coverage.md" \
              --json-output "${report_dir}/changed-code-coverage.json"
            cat "${report_dir}/changed-code-coverage.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "backend pytest succeeded but changed-code coverage artifacts were unavailable" >&2
            exit 1
          fi

      - name: Upload changed-code coverage report
        if: always() && github.event_name == 'pull_request' && needs['backend-scope'].outputs.requires_full_backend == '1'
        uses: actions/upload-artifact@v7
        with:
          name: changed-code-coverage
          path: artifacts/changed-code-coverage
          if-no-files-found: ignore
